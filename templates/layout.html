<script>
document.addEventListener("DOMContentLoaded", () => {
    const text = "Python & Django Developer • Motion Graphics Designer";
    const target = document.getElementById("typing-text");
    const cursor = document.getElementById("typing-cursor");
    let i = 0;

    function typeChar(){
        if (i < text.length){
            target.insertBefore(document.createTextNode(text.charAt(i)), cursor);
            i++;
            setTimeout(typeChar, 45); // typing speed (ms per character)
        }
    }

    typeChar();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const statNumbers = document.querySelectorAll(".stat-number");

    const statObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting){
                const el = entry.target;
                const target = parseInt(el.getAttribute("data-target"));
                let current = 0;
                const duration = 1200; // ms
                const stepTime = Math.max(Math.floor(duration / target), 20);

                const counter = setInterval(() => {
                    current++;
                    el.textContent = current;
                    if (current >= target){
                        clearInterval(counter);
                        el.textContent = target;
                    }
                }, stepTime);

                statObserver.unobserve(el);
            }
        });
    }, { threshold: 0.5 });

    statNumbers.forEach(el => statObserver.observe(el));
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const videos = document.querySelectorAll(".project-video video");

    videos.forEach(video => {
        video.addEventListener("play", () => {
            videos.forEach(other => {
                if (other !== video){
                    other.pause();
                }
            });
        });
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    let width, height, particles;

    function resize(){
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const PARTICLE_COUNT = 70;
    const MAX_DIST = 140;

    class Particle{
        constructor(){
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.radius = Math.random() * 1.5 + 0.5;
        }
        update(){
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw(){
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(96,165,250,0.6)";
            ctx.fill();
        }
    }

    particles = Array.from({length: PARTICLE_COUNT}, () => new Particle());

    function connect(){
        for (let i = 0; i < particles.length; i++){
            for (let j = i + 1; j < particles.length; j++){
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < MAX_DIST){
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(96,165,250,${0.15 * (1 - dist/MAX_DIST)})`;
                    ctx.lineWidth = 1;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
    }

    function animate(){
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        connect();
        requestAnimationFrame(animate);
    }

    animate();
});
</script>
<body>
    
<canvas id="bg-canvas"></canvas>
